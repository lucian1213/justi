  --slate-2:#323232;
  --slate-3:#3b3b3b;
  --chalk:#ecebe6;
  --chalk-dim:#a9a7a0;
  --habit:#24305e;      /* 수녀복 남색 */
  --veil:#9a7be0;       /* 머리카락 보라 */
  --gold:#c8a65a;       /* 십자가·옷깃 금색 */
  --line:rgba(236,235,230,.12);
  --serif:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:var(--serif);
  --brush:"Song Myung","Nanum Myeongjo",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--slate:#262626;--chalk:#ecebe6}
}
:root[data-theme="dark"]{--slate:#262626;--chalk:#ecebe6}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--slate);
  background-image:var(--tex);background-size:480px 480px;background-repeat:repeat;
  color:var(--chalk);font-family:var(--sans);font-size:16px;line-height:1.7;
}
.wrap{max-width:480px;margin:0 auto;padding-bottom:120px}

/* 헤더 */
.hero{position:relative}
.hero img{display:block;width:100%;max-width:100%;height:auto}
.hero img{ /* 하단을 투명하게 녹여 배경 질감과 이어지게 */
  -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent);
          mask-image:linear-gradient(to bottom,#000 72%,transparent)}

.intro{padding:20px 22px 8px;font-family:var(--serif);color:var(--chalk-dim);font-size:15px;line-height:1.8}
.intro b{color:var(--chalk);font-weight:700}

/* 질문 */
.q{padding:30px 18px 6px;border-top:1px solid var(--line);margin-top:22px}
.q:first-of-type{border-top:0;margin-top:6px}
.q-head{display:flex;gap:14px;align-items:baseline;padding:0 4px 16px}
.q-num{font-family:var(--serif);color:var(--gold);font-size:22px;min-width:1.4em;text-align:center;line-height:1}
.q-text{font-family:var(--serif);font-weight:800;font-size:18px;line-height:1.55;margin:0;word-break:keep-all}
.q-sub{display:block;font-weight:400;font-size:14px;color:var(--chalk-dim);margin-top:4px}

.opts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt label{
  display:flex;align-items:center;gap:14px;min-height:54px;padding:12px 16px;
  background:var(--slate-2);border:1px solid transparent;border-radius:10px;
  cursor:pointer;font-size:16px;word-break:keep-all;
  transition:background .15s,border-color .15s;
}
.opt label:active{background:var(--slate-3)}
.mark{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid #6b6a66;display:grid;place-items:center}
.mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--veil);transform:scale(0);transition:transform .15s}
.opt input:checked + label{background:var(--habit);border-color:rgba(154,123,224,.55)}
.opt input:checked + label .mark{border-color:var(--veil)}
.opt input:checked + label .mark::after{transform:scale(1)}
.opt input:focus-visible + label{outline:2px solid var(--veil);outline-offset:2px}

/* 하단 고정 바 */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--slate) 70%,rgba(38,38,38,0));
}
.bar-in{max-width:444px;margin:0 auto;display:flex;align-items:center;gap:14px}
.beads{display:flex;gap:6px;flex:none}
.bead{width:9px;height:9px;border-radius:50%;border:1.5px solid #6b6a66;transition:background .2s,border-color .2s}
.bead.on{background:var(--gold);border-color:var(--gold)}
.go{
  flex:1;height:52px;border:0;border-radius:10px;font-family:var(--serif);font-weight:700;font-size:17px;
  background:var(--chalk);color:#1c1c1c;cursor:pointer;transition:opacity .2s;
}
.go:disabled{opacity:.28;cursor:not-allowed}
.go:focus-visible{outline:2px solid var(--veil);outline-offset:3px}

/* 결과 시트 */
.sheet{position:fixed;inset:0;z-index:10;display:none}
.sheet.open{display:block}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .25s ease}
.panel{
  position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
  background:var(--slate) var(--tex) 0 0/480px 480px repeat;border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:26px 20px calc(20px + env(safe-area-inset-bottom,0px));
  animation:rise .35s cubic-bezier(.2,.8,.2,1);
  max-height:88%;overflow-y:auto;
}
.panel h2{font-family:var(--serif);font-weight:400;font-size:15px;color:var(--chalk-dim);text-align:center;margin:0 0 18px}
.pick{border-radius:14px;padding:22px 20px;margin-bottom:10px;position:relative;overflow:hidden}
.pick.first{background:var(--habit);border:1px solid rgba(154,123,224,.5)}
.pick.second{background:var(--slate-2);border:1px solid var(--line)}
.rank{font-family:var(--serif);font-size:14px;color:var(--gold)}
.role{font-family:var(--brush);font-size:40px;line-height:1.2;margin:6px 0 0;letter-spacing:.02em}
.pick.second .role{font-size:30px}
.pick::after{ /* 십자 문양 */
  content:"";position:absolute;right:18px;top:50%;width:34px;height:52px;transform:translateY(-50%);opacity:.18;
  background:
    linear-gradient(var(--gold),var(--gold)) center/4px 100% no-repeat,
    linear-gradient(var(--gold),var(--gold)) center 30%/100% 4px no-repeat;
}
.pick.second::after{opacity:.1}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;height:48px;border-radius:10px;font-family:var(--sans);font-size:15px;cursor:pointer}
.btn-ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn-solid{background:var(--chalk);color:#1c1c1c;border:0}
.actions button:focus-visible{outline:2px solid var(--veil);outline-offset:2px}

@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.panel,.dim{animation:none}.mark::after,.bead{transition:none}}
</style>
</head>

  <p class="intro">수녀님과의 상담 시간입니다.<br><b>다섯 가지 질문</b>에 답하면 당신에게 어울리는 인물을 알려드릴게요.</p>

  <main id="questions"></main>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="beads" id="beads" aria-hidden="true"></div>
    <button class="go" id="go" disabled>확인하기</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="dim" id="dim"></div>
  <div class="panel">
    <h2 id="sheetTitle">당신에게 어울리는 인물</h2>
    <div class="pick first"><div class="rank">1순위</div><p class="role" id="r1"></p></div>
    <div class="pick second"><div class="rank">2순위</div><p class="role" id="r2"></p></div>
    <div class="actions">
      <button class="btn-ghost" id="close">답변 고치기</button>
      <button class="btn-solid" id="reset">처음부터 다시</button>
    </div>
  </div>
</div>

<script>
const ROLES = ["방화범","살인마","해커","사기꾼","강도"];

const QUESTIONS = [
  { q:"안녕하세요. 요즘은 좀 어떠세요? 고민거리가 있으시다거나…", sub:"당신의 답변은?",
    a:["없어.","아뇨, 그런 건 없습니다.","쾌적한 편입니다.","전혀요! 좋은 편이에요.","수녀님 덕분에 편안하게 지내고 있습니다."] },
  { q:"간식 같은 건 입에 맞으시나요? 부족한 게 있다면 말씀하세요.",
    a:["과자","초코바","사탕","젤리","음료수"] },
  { q:"자유 시간엔 주로…", a:["체력단련","공부","티비 시청","수다","아무것도 안 한다"] },
  { q:"가족들과는…", a:["자주 연락","주에 한 번","한 달에 한 번","일 년에 한 번","안 한다"] },
  { q:"이곳에 오기 전에는…", a:["백수","게임","직장인","공무원","사업가"] },
];

/* ── 역할별 조건표 ──────────────────────────────
   RULES[역할] = [Q1, Q2, Q3, Q4, Q5]
   각 칸은 해당하는 답변 번호(1부터) 배열, null 은 무관 */
const RULES = {
  "방화범": [[1],       null, [2],  [1],  [3]],  // 공부, 직장인
  "사기꾼": [[3,4,5],   null, [4],  [2],  [1]],  // 수다, 백수
  "살인마": [[4,5],     null, [1],  null, [4]],  // 체력단련, 공무원
  "해커":   [[4,5],     [2],  null, null, [2]],  // 초코바, 게임
  "강도":   [[5],       null, null, [2],  null],
};

const numerals = ["Ⅰ","Ⅱ","Ⅲ","Ⅳ","Ⅴ"];
const answers = Array(QUESTIONS.length).fill(null);
const $ = id => document.getElementById(id);

const qWrap = $("questions"), beads = $("beads");
QUESTIONS.forEach((item, qi) => {
  const sec = document.createElement("section");
  sec.className = "q";
  sec.innerHTML = `
    <div class="q-head">
      <span class="q-num" aria-hidden="true">${numerals[qi]}</span>
      <h3 class="q-text" id="qt${qi}">${item.q}${item.sub ? `<span class="q-sub">${item.sub}</span>` : ""}</h3>
    </div>
    <ul class="opts" role="radiogroup" aria-labelledby="qt${qi}">
      ${item.a.map((t, ai) => `
        <li class="opt">
          <input type="radio" name="q${qi}" id="q${qi}a${ai}" value="${ai}">
          <label for="q${qi}a${ai}"><span class="mark"></span><span>${t}</span></label>
        </li>`).join("")}
    </ul>`;
  qWrap.appendChild(sec);
  beads.insertAdjacentHTML("beforeend", `<span class="bead" id="b${qi}"></span>`);
});

qWrap.addEventListener("change", e => {
  const m = e.target.name.match(/^q(\d+)$/);
  if (!m) return;
  const qi = +m[1];
  answers[qi] = +e.target.value;
  $("b" + qi).classList.add("on");
  $("go").disabled = answers.includes(null);
});

/* 점수 = 맞춘 조건 수 ÷ 그 역할의 조건 수 (무관 제외)
   → 조건이 2개뿐인 강도도 4개인 방화범과 공정하게 비교됨.
   동점이면 ① 맞춘 개수가 많은 쪽 ② ROLES 순서 */
function rank() {
  const s = ROLES.map(r => {
    const conds = RULES[r];
    let need = 0, hit = 0;
    conds.forEach((c, qi) => {
      if (!c) return;
      need++;
      if (c.includes(answers[qi] + 1)) hit++;
    });
    return { r, ratio: hit / need, hit };
  });
  s.sort((a, b) => b.ratio - a.ratio || b.hit - a.hit || ROLES.indexOf(a.r) - ROLES.indexOf(b.r));
  return s.map(x => x.r);
}

$("go").addEventListener("click", () => {
  if (answers.includes(null)) return;
  const [first, second] = rank();
  $("r1").textContent = first;
  $("r2").textContent = second;
  $("sheet").classList.add("open");
  $("close").focus();
});
const closeSheet = () => { $("sheet").classList.remove("open"); $("go").focus(); };
$("close").addEventListener("click", closeSheet);
$("dim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
$("reset").addEventListener("click", () => {
  answers.fill(null);
  document.querySelectorAll("input[type=radio]").forEach(i => i.checked = false);
  document.querySelectorAll(".bead").forEach(b => b.classList.remove("on"));
  $("go").disabled = true;
  $("sheet").classList.remove("open");
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
